name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, format, test, and build
    # Playwright 1.58 supports Ubuntu 24.04; ubuntu-latest currently resolves to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 12.16.1
          runtime: node@26
          cache: true
          require-lockfile: true

      - name: Lint frontend
        run: pnpm run lint

      - name: Check API formatting
        run: pnpm --filter api run prettier:check

      - name: Check frontend formatting
        run: pnpm --filter ortsschildsprint-frontend run prettier:check

      - name: Validate API Worker
        run: pnpm --filter api run test

      - name: Build frontend
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm --filter ortsschildsprint-frontend exec playwright install --with-deps

      - name: Run frontend end-to-end tests
        run: pnpm --filter ortsschildsprint-frontend run test:e2e
